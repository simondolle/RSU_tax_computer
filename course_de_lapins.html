<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>La Course des Lapins du Potager des Princes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #87ceeb 0%, #b6e3a7 60%, #7fc56e 100%);
    user-select: none;
    overflow-x: hidden;
  }
  #game {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 8px;
    gap: 6px;
  }
  h1 {
    text-align: center;
    color: #5a3a1a;
    font-size: clamp(18px, 5vw, 28px);
    text-shadow: 2px 2px 0 #fff8;
  }
  #status {
    text-align: center;
    font-size: clamp(14px, 4vw, 18px);
    color: #3a2a0a;
    min-height: 1.4em;
    font-weight: bold;
  }
  #track {
    flex: 1;
    background: repeating-linear-gradient(
      0deg,
      #9bd87a 0 60px,
      #8ccc6a 60px 120px
    );
    border: 4px solid #5a3a1a;
    border-radius: 12px;
    position: relative;
    overflow: hidden;
  }
  .lane {
    position: absolute;
    left: 0; right: 0;
    height: 20%;
    border-bottom: 2px dashed #fff7;
    display: flex;
    align-items: center;
  }
  .lane:nth-child(1) { top: 0; }
  .lane:nth-child(2) { top: 20%; }
  .lane:nth-child(3) { top: 40%; }
  .lane:nth-child(4) { top: 60%; }
  .lane:nth-child(5) { top: 80%; border-bottom: none; }
  .rabbit {
    position: absolute;
    font-size: clamp(28px, 8vw, 44px);
    transition: left 0.1s linear;
    will-change: left, transform;
    cursor: pointer;
    filter: drop-shadow(2px 2px 2px #0004);
  }
  .rabbit.hop { animation: hop 0.3s ease-in-out; }
  @keyframes hop {
    0%, 100% { transform: translateY(0) scaleX(1); }
    50% { transform: translateY(-12px) scaleX(1.05); }
  }
  .rabbit.stunned { filter: grayscale(0.6) brightness(0.8); }
  .stun-star {
    position: absolute;
    font-size: 0.7em;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin {
    from { transform: translateX(-50%) rotate(0deg); }
    to   { transform: translateX(-50%) rotate(360deg); }
  }
  .obstacle {
    position: absolute;
    font-size: clamp(22px, 6.5vw, 34px);
    transform: translateY(-50%);
    cursor: pointer;
    z-index: 2;
    filter: drop-shadow(1px 1px 1px #0006);
    animation: sway 1.5s ease-in-out infinite;
  }
  @keyframes sway {
    0%, 100% { transform: translateY(-50%) rotate(-3deg); }
    50%      { transform: translateY(-50%) rotate(3deg); }
  }
  .poof {
    position: absolute;
    font-size: clamp(20px, 6vw, 28px);
    pointer-events: none;
    transform: translate(-50%, -50%);
    animation: poof 0.5s ease-out forwards;
  }
  @keyframes poof {
    0%   { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(2); }
  }
  .rabbit.chosen::after {
    content: "⭐";
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.6em;
  }
  .finish {
    position: absolute;
    top: 0; bottom: 0;
    right: 4%;
    width: 10px;
    background:
      linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%),
      linear-gradient(45deg, #000 25%, #fff 25%, #fff 75%, #000 75%);
    background-size: 10px 10px;
    background-position: 0 0, 5px 5px;
    box-shadow: 2px 0 0 #fff, 4px 0 0 #000;
  }
  .carrot {
    position: absolute;
    right: 2%;
    top: 50%;
    transform: translateY(-50%);
    font-size: clamp(24px, 7vw, 38px);
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    align-items: center;
  }
  button {
    padding: 12px 18px;
    font-size: clamp(14px, 4vw, 18px);
    font-weight: bold;
    border: 3px solid #5a3a1a;
    border-radius: 12px;
    background: #ffd966;
    color: #5a3a1a;
    cursor: pointer;
    box-shadow: 0 4px 0 #5a3a1a;
    transition: transform 0.05s, box-shadow 0.05s;
  }
  button:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #5a3a1a;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .pick-btn {
    background: #ffb3c1;
    font-size: clamp(18px, 5vw, 24px);
    padding: 6px 10px;
  }
  #start {
    background: #7fc56e;
    color: white;
    font-size: clamp(16px, 5vw, 22px);
    padding: 14px 24px;
  }
  .pick-btn.selected {
    background: #ff6b9d;
    color: white;
    transform: translateY(2px);
  }
  #scoreboard {
    text-align: center;
    font-size: clamp(13px, 3.5vw, 16px);
    color: #3a2a0a;
  }
  #cheer-hint {
    text-align: center;
    font-size: clamp(11px, 3vw, 14px);
    color: #5a3a1a;
    font-style: italic;
  }
  .confetti {
    position: absolute;
    width: 8px;
    height: 8px;
    pointer-events: none;
    animation: fall 2s linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>
<div id="game">
  <h1>🥕 La Course des Lapins 🐰</h1>
  <div id="scoreboard">Manches: <span id="races">0</span> · Victoires: <span id="wins">0</span></div>
  <div id="status">Choisis ton lapin champion !</div>
  <div id="picker" class="controls"></div>
  <div class="controls">
    <button id="start" disabled>🏁 Départ !</button>
    <button id="reset">🔄 Nouvelle course</button>
  </div>
  <div id="cheer-hint">💡 Tape sur les 🌿 pour les enlever, ou tape la piste pour encourager ton lapin !</div>
  <div id="track">
    <div class="finish"></div>
    <div class="carrot">🥕</div>
  </div>
</div>

<script>
const RABBITS = [
  { emoji: "🐰", name: "Coton",    color: "#ffffff" },
  { emoji: "🐇", name: "Réglisse", color: "#3a3a3a" },
  { emoji: "🐰", name: "Caramel",  color: "#c89868" },
  { emoji: "🐇", name: "Pétale",   color: "#ffb3c1" },
  { emoji: "🐰", name: "Trèfle",   color: "#7fc56e" },
];

const track = document.getElementById('track');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('start');
const resetBtn = document.getElementById('reset');
const racesEl = document.getElementById('races');
const winsEl = document.getElementById('wins');

let chosen = null;
let racing = false;
let positions = [];
let lanes = [];
let rabbitsEl = [];
let races = 0;
let wins = 0;
let raceInterval = null;
let obstacles = [];
let stunned = [];

function buildTrack() {
  // remove old lanes & rabbits
  document.querySelectorAll('.lane, .rabbit').forEach(e => e.remove());
  lanes = [];
  rabbitsEl = [];
  positions = RABBITS.map(() => 0);

  RABBITS.forEach((r, i) => {
    const lane = document.createElement('div');
    lane.className = 'lane';
    lane.style.top = (i * 20) + '%';
    track.appendChild(lane);
    lanes.push(lane);

    const rab = document.createElement('div');
    rab.className = 'rabbit';
    rab.textContent = r.emoji;
    rab.style.left = '2%';
    rab.style.top = (i * 20 + 5) + '%';
    rab.dataset.idx = i;
    track.appendChild(rab);
    rabbitsEl.push(rab);
  });
}

function spawnObstacles() {
  obstacles.forEach(arr => arr.forEach(o => o.el.remove()));
  obstacles = RABBITS.map(() => []);
  stunned = RABBITS.map(() => 0);
  RABBITS.forEach((_, laneIdx) => {
    const count = 2 + Math.floor(Math.random() * 2);
    const taken = [];
    for (let i = 0; i < count; i++) {
      let x, tries = 0;
      do {
        x = 25 + Math.random() * 55;
        tries++;
      } while (tries < 8 && taken.some(t => Math.abs(t - x) < 12));
      taken.push(x);
      const obs = document.createElement('div');
      obs.className = 'obstacle';
      obs.textContent = '🌿';
      obs.style.left = x + '%';
      obs.style.top = (laneIdx * 20 + 10) + '%';
      obs.dataset.lane = laneIdx;
      obs.dataset.x = x;
      track.appendChild(obs);
      obstacles[laneIdx].push({ x, el: obs });
    }
  });
}

function setStun(idx, on) {
  if (on) {
    rabbitsEl[idx].classList.add('stunned');
    if (!rabbitsEl[idx].querySelector('.stun-star')) {
      const s = document.createElement('span');
      s.className = 'stun-star';
      s.textContent = '💫';
      rabbitsEl[idx].appendChild(s);
    }
  } else {
    rabbitsEl[idx].classList.remove('stunned');
    const s = rabbitsEl[idx].querySelector('.stun-star');
    if (s) s.remove();
  }
}

function buildPicker() {
  const picker = document.getElementById('picker');
  picker.innerHTML = '';
  RABBITS.forEach((r, i) => {
    const btn = document.createElement('button');
    btn.className = 'pick-btn';
    btn.innerHTML = `${r.emoji}<br><small style="font-size:0.55em">${r.name}</small>`;
    btn.onclick = () => choose(i);
    picker.appendChild(btn);
  });
}

function choose(idx) {
  if (racing) return;
  chosen = idx;
  document.querySelectorAll('.pick-btn').forEach((b, i) => {
    b.classList.toggle('selected', i === idx);
  });
  rabbitsEl.forEach((r, i) => r.classList.toggle('chosen', i === idx));
  startBtn.disabled = false;
  statusEl.textContent = `Allez ${RABBITS[idx].name} ! 🎉`;
}

function beep(freq, dur) {
  try {
    const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = freq;
    osc.type = 'square';
    gain.gain.value = 0.05;
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur);
  } catch (e) {}
}

function hop(idx) {
  rabbitsEl[idx].classList.remove('hop');
  void rabbitsEl[idx].offsetWidth;
  rabbitsEl[idx].classList.add('hop');
}

function startRace() {
  if (chosen === null || racing) return;
  racing = true;
  startBtn.disabled = true;
  positions = RABBITS.map(() => 0);
  rabbitsEl.forEach((r, i) => { r.style.left = '2%'; setStun(i, false); });
  spawnObstacles();
  statusEl.textContent = "3... 2... 1... GO ! 🏁";
  beep(440, 0.1);
  setTimeout(() => beep(440, 0.1), 400);
  setTimeout(() => beep(880, 0.3), 800);

  setTimeout(() => {
    raceInterval = setInterval(() => {
      let winner = -1;
      for (let i = 0; i < RABBITS.length; i++) {
        if (stunned[i] > 0) {
          stunned[i]--;
          if (stunned[i] === 0) setStun(i, false);
        } else {
          const speed = 0.3 + Math.random() * 1.2;
          const newPos = positions[i] + speed;
          const hit = obstacles[i].find(o => positions[i] < o.x && newPos >= o.x);
          if (hit) {
            positions[i] = hit.x - 0.5;
            stunned[i] = 8;
            setStun(i, true);
            beep(180, 0.1);
          } else {
            positions[i] = newPos;
            if (Math.random() < 0.15) hop(i);
          }
          rabbitsEl[i].style.left = `calc(2% + ${positions[i]}% )`;
          if (positions[i] >= 88 && winner === -1) winner = i;
        }
      }
      if (winner !== -1) {
        clearInterval(raceInterval);
        finishRace(winner);
      }
    }, 80);
  }, 1000);
}

function finishRace(winner) {
  racing = false;
  races++;
  racesEl.textContent = races;
  const won = winner === chosen;
  if (won) {
    wins++;
    winsEl.textContent = wins;
    statusEl.textContent = `🎉 BRAVO ! ${RABBITS[winner].name} a gagné ! 🥕`;
    confetti();
    beep(660, 0.15);
    setTimeout(() => beep(880, 0.15), 150);
    setTimeout(() => beep(1100, 0.3), 300);
  } else {
    statusEl.textContent = `🏆 ${RABBITS[winner].name} a gagné. Pas de chance pour ${RABBITS[chosen].name} !`;
    beep(220, 0.4);
  }
  startBtn.textContent = "🏁 Rejouer !";
  startBtn.disabled = chosen === null;
}

function reset() {
  if (raceInterval) clearInterval(raceInterval);
  racing = false;
  chosen = null;
  document.querySelectorAll('.obstacle, .poof').forEach(e => e.remove());
  obstacles = [];
  stunned = [];
  buildTrack();
  buildPicker();
  startBtn.disabled = true;
  startBtn.textContent = "🏁 Départ !";
  statusEl.textContent = "Choisis ton lapin champion !";
}

function confetti() {
  const colors = ['#ff6b9d', '#ffd966', '#7fc56e', '#6ec3ff', '#c89868'];
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.top = '-10px';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDelay = Math.random() * 0.5 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2500);
  }
}

// Cheer: tap on track to give chosen rabbit a small boost
track.addEventListener('pointerdown', (e) => {
  if (!racing || chosen === null) return;
  if (e.target.classList && e.target.classList.contains('obstacle')) {
    const laneIdx = parseInt(e.target.dataset.lane);
    const x = parseFloat(e.target.dataset.x);
    obstacles[laneIdx] = obstacles[laneIdx].filter(o => o.el !== e.target);
    const rect = track.getBoundingClientRect();
    const poof = document.createElement('div');
    poof.className = 'poof';
    poof.textContent = '💨';
    poof.style.left = (e.clientX - rect.left) + 'px';
    poof.style.top  = (e.clientY - rect.top)  + 'px';
    track.appendChild(poof);
    setTimeout(() => poof.remove(), 500);
    e.target.remove();
    beep(660, 0.06);
    return;
  }
  positions[chosen] += 1.5;
  hop(chosen);
  beep(880, 0.04);
  // little + sign
  const plus = document.createElement('div');
  plus.textContent = '+';
  plus.style.position = 'absolute';
  const rect = track.getBoundingClientRect();
  plus.style.left = (e.clientX - rect.left) + 'px';
  plus.style.top = (e.clientY - rect.top) + 'px';
  plus.style.color = '#ff6b9d';
  plus.style.fontWeight = 'bold';
  plus.style.fontSize = '24px';
  plus.style.pointerEvents = 'none';
  plus.style.transition = 'all 0.6s ease-out';
  track.appendChild(plus);
  requestAnimationFrame(() => {
    plus.style.transform = 'translateY(-30px)';
    plus.style.opacity = '0';
  });
  setTimeout(() => plus.remove(), 600);
});

startBtn.onclick = startRace;
resetBtn.onclick = reset;

buildTrack();
buildPicker();
</script>
</body>
</html>
